<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#091421" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
<div data-page="" style="min-height:100vh; background:var(--bg); background-image:linear-gradient(var(--grid) 1px, transparent 1px),linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:48px 48px; background-position:center top; padding:24px; box-sizing:border-box; display:flex; align-items:center; justify-content:center">
  <main style="width:100%; max-width:520px; box-sizing:border-box; border:1px solid var(--line); background:var(--surface); border-radius:3px; box-shadow:var(--shadow); overflow:hidden">
    <div style="display:flex; align-items:center; gap:10px; padding:14px 22px; border-bottom:1px solid var(--line)">
      <h2 style="font:500 11.5px/1 'IBM Plex Sans',system-ui,sans-serif; letter-spacing:.13em; text-transform:uppercase; color:var(--muted)">Error</h2>
      <span style="font:400 11.5px/1 'IBM Plex Mono',ui-monospace,monospace; color:var(--accent)">404</span>
    </div>
    <div style="padding:22px; display:flex; flex-direction:column; gap:16px">
      <h1 style="font-family:'IBM Plex Sans',system-ui,sans-serif; font-weight:700; font-size:29px; line-height:1.05; letter-spacing:-0.025em; color:var(--fg)">Page not found</h1>
      <p style="margin:0; font:400 14px/1.65 'IBM Plex Sans',system-ui,sans-serif; color:var(--muted); text-wrap:pretty">That address doesn't exist here. It may have moved, or it may never have existed.</p>
      <a href="/" class="hv-border" style="align-self:flex-start; display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:2px; padding:9px 13px; font:500 11.5px/1 'IBM Plex Sans',system-ui,sans-serif; letter-spacing:.14em; text-transform:uppercase; transition:border-color .32s cubic-bezier(.33,.02,.24,1)">Back home<span aria-hidden="true" style="color:var(--accent)">→</span></a>
    </div>
  </main>
</div>
</body>
</html>
